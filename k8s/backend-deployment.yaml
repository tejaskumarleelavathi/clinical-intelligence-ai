apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    spec:
      containers:
      - name: backend
        image: yourregistry.azurecr.io/clinical-ai-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: clinical-ai-secrets
